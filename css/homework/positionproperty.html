* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
}

.photo {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
}

.photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.name {
  position: absolute;
  color: white;
  font-size: 20px;
  font-weight: bold;
  text-shadow: 1px 1px 4px black;
}

.top-left {
  top: 16px;
  left: 16px;
}

.top-center {
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
}

.top-right {
  top: 16px;
  right: 16px;
}

.left-center {
  top: 50%;
  left: 16px;
  transform: translateY(-50%);
}

.middle-center {
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

.right-center {
  top: 50%;
  right: 16px;
  transform: translateY(-50%);
}

.bottom-left {
  bottom: 16px;
  left: 16px;
}

.bottom-center {
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
}

.bottom-right {
  right: 16px;
  bottom: 16px;
}


</style>
</head>
<body>
  <main class="photo">
    <img src="image.png" alt="simran">

    <span class="name top-left">Simran</span>
    <span class="name top-right">Simran</span>
    <span class="name left-center">Simran</span>
    <span class="name middle-center">Simran</span>
    <span class="name right-center">Simran</span>
    <span class="name top-center">Simran</span>
    <span class="name bottom-center">Simran</span>


    
  </main>
</body>
